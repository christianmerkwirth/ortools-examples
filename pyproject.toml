[project]
name = "ortools-examples"
version = "0.1.0"
description = "Tested, documented examples of Google OR-Tools in Python."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Christian Merkwirth" }]
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15,<9.16",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]
ignore = ["D105", "D107", "D203", "D213", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
